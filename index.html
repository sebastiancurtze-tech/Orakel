/* Layout: one narrow column, a single phone passed around the table; the ball sits on top like a centerpiece */
:root{

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--parchment)}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;

h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.04em}
h1{font-size:2.4rem;color:var(--brass)}

h3{font-size:1.15rem;color:var(--brass)}
p{margin:0}
.muted{color:var(--mist)}
.small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero svg{width:110px;height:auto;filter:drop-shadow(0 8px 24px rgba(150,110,220,.35))}
.hero.small-hero svg{width:60px}

.panel{background:var(--velvet);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}

.between{justify-content:space-between}

.btn{background:var(--brass);color:#22182f}
.btn:disabled{background:var(--brass-dim);opacity:.6;cursor:not-allowed}

.b-curse{background:linear-gradient(160deg,#7d4fb8,#4b2d7a);color:var(--parchment);border-color:#9c78d6}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.timer{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.9rem;color:var(--mist);font-variant-numeric:tabular-nums}
.timer.due{border-color:var(--brass);color:var(--parchment);background:var(--velvet-2)}

.prop{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.prop .meta{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}

  .reveal{animation:glow .5s ease-out}
  @keyframes glow{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
}
</style>
</head>

}
function validTargets(writerId){
  const w = state.write;
  const writersAfter = w.order.slice(w.idx + 1);
  const free = state.players.map(p => p.id).filter(id => !w.taken.includes(id));
  return free.filter(t => {
    if(t === writerId) return false;
    const rest = free.filter(x => x !== t);
    return !(writersAfter.length === 1 && rest.length === 1 && writersAfter[0] === rest[0]);
  });
}

/* ---------- Render ---------- */
function render(){
  pruneCurses();
  let h = "";
  if(ui.view === "askreset") h = vReset();
  else if(state.phase === "setup") h = vSetup();
  else if(state.phase === "write") h = vWrite();
  else if(state.phase === "play") h = ui.view ? vFlow() : vTable();
  else h = vEnd();
  document.getElementById("app").innerHTML = h;
  syncWakeLock();
  const f = document.querySelector("[autofocus]"); if(f) f.focus();
  save();
}

function vSetup(){

  return `${hero()}
  <div class="panel">

  </div>

function timerBox(){

  return `<div class="timer due"><span>Das Orakel ruft: Zeit für neue Prophezeiungen.</span><button class="btn btn-sm" data-act="newround">Schreiben</button></div>`;
}
function cursesPanel(){
  if(!state.curses.length) return "";

  return `<div class="panel" style="border-color:#5b3f86"><div class="row between"><h3 style="color:var(--curse)">Aktive Flüche</h3><span class="small muted">Brechen kostet 1 Schluck</span></div>

      <div class="grid2"><button class="btn big" data-act="g-right" data-id="${sel || ""}" ${sel ? "" : "disabled"}>Richtig</button><button class="ghost big" data-act="g-wrong">Daneben</button></div>`; })()}`;
  if(v === "result") return `${hero(true)}<div class="reveal">${ui.msg}</div><button class="btn big" data-act="back">Zurück zum Tisch</button>`;
  if(v === "c-who") return `${hero(true)}<h2>Wer spricht einen Fluch aus?</h2><p class="small muted">Jeder einmal pro Abend, sobald die eigene Prophezeiung getroffen hat.</p>

  if(v === "c-target") { const c = CURSES[ui.ci]; return `${hero(true)}<h2>Wen trifft der Fluch?</h2><p class="secret">${esc(c.x.split("{n}").join("…"))} · ${durLabel(c.d)}</p>
    <div class="pick">${state.players.filter(p => p.id !== ui.caster).map(p => `<button data-act="c-tgt" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>

  if(v === "c-break") return `${hero(true)}<h2>Wer hat den Fluch gebrochen?</h2><div class="pick">${state.players.map(p => `<button data-act="c-breaker" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div><button class="ghost" data-act="back">Abbrechen</button>`;
  if(v === "askend") return `${hero(true)}<div class="reveal"><p class="quote">Abend beenden?</p><p class="muted small" style="margin-top:10px">Alle Prophezeiungen werden enthüllt, auch für die Opfer.</p></div>

function vEnd(){
  const ps = state.players, all = state.prophecies;
  const best = key => { const m = Math.max(...ps.map(key)); if(m <= 0) return "niemand"; return ps.filter(p => key(p) === m).map(p => esc(p.name)).join(", ") + ` (${m})`; };
  const hitOn = p => all.filter(x => x.target === p.id).reduce((s,x) => s + x.hits, 0);
  const sorted = all.slice().sort((a,b) => b.hits - a.hits);
  return `${hero()}
  <div class="panel"><h3>Die Ehrungen</h3>
    <div class="award"><span>Orakel des Abends</span><span>${best(p => p.hits)}</span></div>
    <div class="award"><span>Ahnungslosestes Opfer</span><span>${best(hitOn)}</span></div>
    <div class="award"><span>Hellseher</span><span>${best(p => p.solved)}</span></div>
    <div class="award"><span>Durstigste Seele</span><span>${best(p => p.drink)}</span></div>
  </div>
  <div class="panel"><h3>Alle Prophezeiungen</h3>
    ${sorted.length ? sorted.map(x => `<div class="prop"><span class="meta">${name(x.author)} über ${name(x.target)} · ${x.status === "solved" ? "erraten" : "nie erraten"}</span><span>${esc(x.text)}</span><span class="hits">${x.hits}× getroffen</span></div>`).join("") : `<p class="muted">Keine.</p>`}
  </div>
  <div class="panel"><h3>Endstand</h3>
    <div class="board"><div class="line head"><span>Name</span><span class="num">Getrunken</span><span class="num">Treffer</span><span class="num">Erraten</span></div>
    ${ps.map(p => `<div class="line"><span>${esc(p.name)}</span><span class="num drink">${p.drink}</span><span class="num give">${p.hits}</span><span class="num">${p.solved}</span></div>`).join("")}</div>
  </div>
  <button class="btn big" data-act="again">Neues Spiel, gleiche Runde</button>
  <button class="ghost" data-act="reset">Ganz neu anfangen</button>`;
}
function vReset(){
  return `${hero(true)}<div class="reveal"><p class="quote">Spiel neu starten?</p><p class="muted small" style="margin-top:10px">Alle Prophezeiungen und Schlucke werden gelöscht. Das lässt sich nicht rückgängig machen.</p></div>
  <div class="stack"><button class="btn" data-act="again">Neu starten, gleiche Leute</button><button class="ghost" data-act="reset">Komplett neu, Leute neu eintragen</button><button class="ghost" data-act="back">Abbrechen</button></div>`;
}

/* ---------- Flüche ---------- */
function curseUsedSet(){ try{ return new Set(JSON.parse(localStorage.getItem("orakel-used-curses")) || []); }catch(e){ return new Set(); } }
function drawCurses(){
  const all = CURSES.map((_,i) => i), used = curseUsedSet();
  state.usedCurses.forEach(i => used.add(i));
  let pool = all.filter(i => !used.has(i));
  if(pool.length < 6){ try{ localStorage.removeItem("orakel-used-curses"); }catch(e){} pool = all.filter(i => !state.usedCurses.includes(i)); }
  const pick = [];
  for(const t of ["player","group","evening"]){ const c = pool.filter(i => CURSES[i].t === t); if(c.length) pick.push(rnd(c)); }
  return pick;
}
function castCurse(i, targetId){
  const c = CURSES[i], caster = P(ui.caster);
  const text = c.x.split("{n}").join(targetId ? P(targetId).name : "");
  state.curses.push({id:uid(), t:c.t, text, target:targetId, until: c.d ? Date.now() + c.d*60000 : null});
  state.usedCurses.push(i); caster.curseUsed = true;
  try{ const s = curseUsedSet(); s.add(i); localStorage.setItem("orakel-used-curses", JSON.stringify([...s])); }catch(e){}
  addLog(`<b>${esc(caster.name)}</b> spricht einen Fluch aus: „${esc(text)}“`);
  go({view:"result", msg:`<p class="label" style="color:var(--curse)">${esc(caster.name)} spricht einen Fluch aus · ${durLabel(c.d)}</p><p class="quote">${esc(text)}</p>`});
}
function pruneCurses(){
  const now = Date.now();
  state.curses.filter(c => c.until && c.until <= now).forEach(c => addLog(`Der Fluch ist erloschen: „${esc(c.text)}“`));
  state.curses = state.curses.filter(c => !c.until || c.until > now);
}

/* ---------- Events ---------- */
document.addEventListener("submit", e => {
  if(e.target.dataset.form !== "add") return;
  e.preventDefault();
  const n = document.getElementById("newName").value.trim();
  if(n && !state.players.some(p => p.name.toLowerCase() === n.toLowerCase())) state.players.push(resetPlayer({id:uid(), name:n}));
  render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case "rm": state.players = state.players.filter(p => p.id !== id); render(); break;
    case "interval": state.interval = +b.dataset.n; render(); break;
    case "sips": state.sips = +b.dataset.n; render(); break;
    case "curses": state.cursesOn = b.dataset.v === "1"; render(); break;
    case "start": if(state.players.length >= 3) startWriteRound(); break;
    case "iam": go({view:"form"}); break;
    case "idea": { const t = P(document.getElementById("tSel").value); if(t) document.getElementById("xTxt").value = rnd(IDEAS).replace("{n}", t.name); break; }
    case "seal": {
      const w = state.write, writer = w.order[w.idx];
      const target = document.getElementById("tSel").value, text = document.getElementById("xTxt").value.trim();
      if(!text){ document.getElementById("werr").textContent = "Die Prophezeiung ist noch leer."; document.getElementById("xTxt").focus(); return; }
      state.prophecies.push({id:uid(), author:writer, target, text, round:state.round, hits:0, status:"active"});
      w.taken.push(target); w.idx++;
      if(w.idx >= w.order.length){
        state.write = null; state.phase = "play";
        state.nextAt = state.interval ? Date.now() + state.interval*60000 : null; state.dueNotified = false;
        addLog(state.round === 1 ? "Alle Prophezeiungen sind versiegelt. Das Orakel wacht." : `Runde ${state.round}: neue Prophezeiungen sind im Spiel.`);
      }
      go({view:null}); break;
    }
    case "postpone": {
      const w = state.write;
      state.prophecies = state.prophecies.filter(x => x.round !== state.round);
      state.round--; state.write = null; state.phase = "play"; state.nextAt = Date.now() + 10*60000; state.dueNotified = false;
      if(w && w.idx) addLog("Die neue Runde wurde verschoben.");
      go({view:null}); break;
    }
    case "newround": startWriteRound(); break;
    case "awake": state.keepAwake = state.keepAwake === false; syncWakeLock(); render(); break;
    case "gong": state.gong = state.gong === false; if(state.gong) playGong(); render(); break;
    case "orakel": go({view:"o-victim"}); break;
    case "o-pick": go({view:"o-hide", victim:id}); break;
    case "o-show": go({view:"o-show", victim:ui.victim}); break;
    case "o-sel": ui.sel = id; render(); break;
    case "g-sel": ui.sel = id; render(); break;
    case "o-hit": {
      const x = state.prophecies.find(y => y.id === id), v = P(x.target);
      x.hits++; P(x.author).hits++; v.drink += state.sips;
      addLog(`<b>${esc(v.name)}</b> musste trinken. Das Orakel schweigt.`);
      go({view:"result", msg:`<p class="label">Das Orakel hat gesprochen</p><p class="quote">${esc(v.name)} trinkt ${state.sips}</p><p class="muted small" style="margin-top:10px">Warum? Das bleibt ein Geheimnis. Jetzt darf ${esc(v.name)} wieder hinschauen.</p>`});
      break;
    }
    case "guess": go({view:"g-victim"}); break;
    case "g-pick": go({view:"g-say", victim:id}); break;
    case "g-show": go({view:"g-show", victim:ui.victim}); break;
    case "g-right": {
      const x = state.prophecies.find(y => y.id === id), v = P(x.target), au = P(x.author);
      x.status = "solved"; v.solved++; v.wrong = 0; au.drink += 3;
      addLog(`<b>${esc(v.name)}</b> hat es erraten: „${esc(x.text)}“ ${esc(au.name)} trinkt 3.`);
      go({view:"result", msg:`<p class="label">${esc(v.name)} hat das Orakel durchschaut</p><p class="quote">„${esc(x.text)}“</p><p class="drink" style="margin-top:10px">Prophezeit von ${esc(au.name)}: trinkt 3</p><p class="muted small" style="margin-top:6px">Die Prophezeiung ist gebrochen. ${x.hits}× hat sie zugeschlagen.</p>`});
      break;
    }
    case "g-wrong": {
      const v = P(ui.victim), n = penalty(v); v.drink += n; v.wrong = (v.wrong || 0) + 1;
      addLog(`<b>${esc(v.name)}</b> lag daneben und trinkt ${n}.`);
      go({view:"result", msg:`<p class="label">Daneben</p><p class="quote">${esc(v.name)} trinkt ${n}</p><p class="muted small" style="margin-top:10px">Das Orakel bleibt im Verborgenen. Der nächste falsche Tipp kostet ${n + 1}.</p>`});
      break;
    }
    case "curse": go({view:"c-who"}); break;
    case "c-caster": go({view:"c-choose", caster:id, opts:drawCurses()}); break;
    case "c-pick": { const i = +b.dataset.i; if(CURSES[i].t === "player") go({...ui, view:"c-target", ci:i}); else castCurse(i, null); break; }
    case "c-tgt": castCurse(ui.ci, id); break;
    case "c-again": go({...ui, view:"c-choose"}); break;
    case "c-broke": {
      const c = state.curses.find(x => x.id === id); if(!c) break;
      if(c.t === "player" && P(c.target)){ P(c.target).drink++; addLog(`<b>${name(c.target)}</b> hat den Fluch gebrochen und trinkt 1.`); render(); }
      else go({view:"c-break", cid:id});
      break;
    }
    case "c-breaker": P(id).drink++; addLog(`<b>${name(id)}</b> hat einen Fluch gebrochen und trinkt 1.`); go({view:null}); break;
    case "c-lift": { const c = state.curses.find(x => x.id === id); state.curses = state.curses.filter(x => x.id !== id); if(c) addLog(`Fluch aufgehoben: „${esc(c.text)}“`); render(); break; }
    case "askend": go({view:"askend"}); break;
    case "end": state.phase = "end"; state.write = null; go({view:null}); break;
    case "askreset": go({view:"askreset"}); break;
    case "again": { const ps = state.players.map(p => resetPlayer({id:p.id, name:p.name})); const s = fresh(ps); s.interval = state.interval; s.sips = state.sips; s.cursesOn = state.cursesOn; state = s; startWriteRound(); break; }
    case "reset": { const s = fresh([]); s.interval = state.interval; s.sips = state.sips; s.cursesOn = state.cursesOn; state = s; go({view:null}); break; }
    case "back": go({view: state.phase === "write" ? null : null}); break;
  }
});
/* ---------- Gong, Vibration und wacher Bildschirm ---------- */
let audioCtx = null;
function unlockAudio(){
  try {
    if(!audioCtx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) audioCtx = new AC(); }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
function playGong(){
  if(!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + .05, out = audioCtx.createGain();
    out.gain.value = .5; out.connect(audioCtx.destination);
    [[196,.9,4.5],[392,.55,3.2],[523.3,.35,2.6],[587.3,.3,2.2],[784,.18,1.6]].forEach(([f,g,d]) => {
      [0, 1.7].forEach(delay => {
        const o = audioCtx.createOscillator(), v = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = delay ? f*1.5 : f;
        v.gain.setValueAtTime(0, t0 + delay); v.gain.linearRampToValueAtTime(g*(delay ? .6 : 1), t0 + delay + .02);
        v.gain.exponentialRampToValueAtTime(.0001, t0 + delay + d);
        o.connect(v); v.connect(out); o.start(t0 + delay); o.stop(t0 + delay + d + .1);
      });
    });
  } catch(e){}
}
let wakeLock = null;
async function syncWakeLock(){
  const want = state && state.keepAwake !== false && (state.phase === "play" || state.phase === "write") && document.visibilityState === "visible";
  try {
    if(want && !wakeLock && navigator.wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ wakeLock = null; }
}
function checkDue(){
  if(isDue() && !state.dueNotified){
    state.dueNotified = true; save();
    if(state.gong !== false) playGong();
    try { if(navigator.vibrate) navigator.vibrate([300,120,300,120,500]); } catch(e){}
    if(!ui.view) render();
    return true;
  }
  return false;
}
document.addEventListener("pointerdown", unlockAudio, {capture:true});
document.addEventListener("visibilitychange", () => { syncWakeLock(); if(document.visibilityState === "visible" && state){ checkDue(); if(state.phase === "play" && !ui.view) render(); } });
let tick = 0;
setInterval(() => {
  if(!state || state.phase !== "play") return;
  tick++;
  const fired = checkDue();
  if(!fired && !ui.view && tick % 4 === 0) render();
}, 5000);

function start(data){
  state = (data && data.state) || load() || fresh();
  if(data && data.ui) ui = data.ui;
  render();
}
window.claude?.hot?.snapshot?.(() => ({state, ui}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
